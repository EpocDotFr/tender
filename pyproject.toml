[project]
name = "gemini-tender"
requires-python = ">= 3.14"
authors = [
  {name = "Maxime 'Epoc' Gross", email = "contact.nospam@epoc.nospam.fr"},
]
description = "A Gemini (the protocol) low-level client, implemented in Python"
readme = "README.md"
keywords = ["asyncio", "gemini-protocol", "client", "dependency-free"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Internet",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15"
]
dynamic = ["version"]
license = "LicenseRef-DBAD"
license-files = ['LICENSE.md']

[project.urls]
Documentation = "https://github.com/EpocDotFr/tender?tab=readme-ov-file#usage"
Repository = "https://github.com/EpocDotFr/tender"
Issues = "https://github.com/EpocDotFr/tender/issues"
Changelog = "https://github.com/EpocDotFr/tender/releases"

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "twine~=7.0.0",
    "build~=1.6.0",
]

[tool.setuptools.dynamic]
version = {attr = "tender.__version__"}